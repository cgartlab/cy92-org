version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase
    # 把同生态的全部更新合成 1 个 PR，避免每周刷出 5+ 个 PR
    groups:
      npm-deps:
        patterns:
          - "*"
        # 只允许 patch/minor 升级；major 属于 breaking change（Astro 5→7 API 全变、
        # TailwindCSS 3→4 完全重写、TypeScript 5→7 工具链变），需要人工迁移，
        # 与 AGENTS.md 明确规定的版本约定（Astro 5.x、TailwindCSS 3.4）保持一致。
        update-types:
          - patch
          - minor
    # 双保险：ignore 层排除所有包的 major 升级，避免组外单独生成 major PR
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5
    rebase-strategy: auto