name: PR Triage

# WARNING: pull_request_target runs with a write-scoped GITHUB_TOKEN and
# access to repo secrets. Do NOT add actions/checkout, build steps, or any
# execution of code/files from the PR in this workflow.

# NOTE: assigning the PR author is deliberately NOT done here — it lives in
# auto-assign.yml. Both workflows used to assign on `opened`, and because
# actions-ecosystem/action-add-assignees has no "tolerate existing assignee"
# input, the second one to run always failed with
#   Validation Failed: "Could not add assignees: Assignee has already been taken"
# Keep assign logic in exactly one workflow.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
