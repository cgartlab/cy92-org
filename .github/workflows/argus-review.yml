name: Argus-Flash Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Least privilege: read contents; write pull requests and issues for the
# review comment.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Dependabot PRs do not receive repository secrets, so the
    # create-github-app-token step always fails on them; and a pure
    # dependency bump needs no frontend design review.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Hard cap. The action wraps each `opencode github run` with GNU `timeout`
    # (default 480s), but that is per model attempt: a pathological
    # fallback-queue loop would still eat the full 6 h GitHub default
    # without this.
    #
    # Sizing: the queue is primary + every entry of `fallback_models`, tried
    # sequentially, and the action declares no `timeout` input (so the 480s
    # per-attempt default cannot be overridden from here). With the current
    # config/free-models.yml queue of 2 fallbacks that is 3 attempts:
    #     3 x 480s = 1440s = 24 min
    # config/free-models.yml is auto-refreshed every 12 h, so the queue can
    # grow; 35 min covers today's 24 min + ~5 min setup with room for one
    # more queued model. A shorter cap (e.g. 15) would let the job-level
    # timeout kill a review that is still legitimately working through its
    # fallback queue.
    #
    # Valid at job scope; the action's own steps cannot carry
    # timeout-minutes (composite-action manifests reject it).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate argus-flash token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ARGUS_FLASH_APP_ID }}
          private-key: ${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}

      - uses: cgartlab/argus/.github/actions/argus-review@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
