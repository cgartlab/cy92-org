name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (no exit-0 masking)
        run: pnpm exec astro build
      - name: Unit tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm exec tsc
      - name: Check internal links
        run: pnpm check:links
      - name: Check i18n completeness
        run: pnpm check:i18n
      - name: Wrangler dry-run
        run: pnpm exec wrangler deploy --dry-run
